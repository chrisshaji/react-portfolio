  :root { --ink: #121211; --ink-2: #5f5e5a; --surface: #ffffff; --wash: #f4f3ef;
    --line: #cfcec7; --error: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f1ec; --ink-2: #b5b4ad; --surface: #1d1d1b; --wash: #141413;
      --line: #4a4945; --error: #f2857d; }
  }
  html, body { height: 100%; margin: 0; background: var(--wash); color: var(--ink);
    font: 16px/1.45 "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; padding: 0 16px; box-sizing: border-box; }
  form { width: 100%; max-width: 360px; box-sizing: border-box; padding: 40px 36px 32px;
    background: var(--surface); border-radius: 3px;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 8px 28px rgb(0 0 0 / 0.12); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-2); }
  h1 { margin: 6px 0 28px; font-size: 30px; line-height: 1.1; font-weight: 700;

async function unseal(passcode) {
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passcode), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: bytes(SEALED.salt), iterations: SEALED.iterations },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(SEALED.iv) }, key, bytes(SEALED.data));
  return new TextDecoder().decode(plain);
}

  message.textContent = "";
  if (!window.crypto || !crypto.subtle) {
    message.textContent = "This browser can only open the map over https or from localhost.";
    button.disabled = false;
    return;
  }
  try {
    const html = await unseal(document.getElementById("passcode").value);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    message.textContent = "That passcode didn't work.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
