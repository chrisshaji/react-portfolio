const bytes = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));

async function unseal(passcode) {
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passcode), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: bytes(SEALED.salt), iterations: SEALED.iterations },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(SEALED.iv) }, key, bytes(SEALED.data));
  return new TextDecoder().decode(plain);
}

document.getElementById("form").addEventListener("submit", async event => {
  event.preventDefault();
  const button = document.getElementById("open");
  const message = document.getElementById("message");
  button.disabled = true;
  message.textContent = "";
  try {
    const html = await unseal(document.getElementById("passcode").value);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    message.textContent = "That passcode didn't work.";
    button.disabled = false;
  }
});
</script>
